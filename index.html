<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Kinelayer · 可编程动态海报工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      启动期致命错误兜底：模块解析失败 / 顶层异常时 React 还没挂载，
      控制台又常被用户忽略，所以这里直接把错误画到页面上。
      只处理「应用没起来」这一类错误，运行期错误由 Toasts + 状态栏负责。
    -->
    <script>
      (function () {
        var shown = false;
        function show(detail) {
          if (shown) return;
          shown = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="max-width:760px;margin:12vh auto;padding:28px 30px;border:1px solid #2a2f3a;border-radius:14px;background:#14171d;color:#e6e9ef;font:14px/1.7 ui-sans-serif,system-ui,\'Microsoft YaHei\',sans-serif">' +
            '<div style="font-size:16px;font-weight:600;color:#ff8f8f;margin-bottom:6px">Kinelayer 没能启动</div>' +
            '<div style="color:#9aa4b2;margin-bottom:16px">通常是依赖没装好，或者改了代码有语法/类型错误。先试 <code style="color:#7cf7d4">npm install</code> 再 <code style="color:#7cf7d4">npm run dev</code>；仍不行看下面的堆栈。</div>' +
            '<pre style="margin:0;padding:14px;border-radius:10px;background:#0d0f13;color:#ffb4b4;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word"></pre>' +
            '</div>';
          root.querySelector('pre').textContent = String(detail);
        }
        window.addEventListener('error', function (e) {
          show((e.error && e.error.stack) || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('Unhandled rejection: ' + ((e.reason && e.reason.stack) || e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
